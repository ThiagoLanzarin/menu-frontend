    <!-- Alface -->
    <path d="M126 154 q12 10 24 0 t24 0 t24 0 t24 0 t24 0 t24 0 t24 0"/>
    <!-- Carne -->
    <rect x="130" y="164" width="140" height="16" rx="8"/>
    <!-- Pão de baixo -->
    <path d="M134 190 h132 a8 8 0 0 1 -8 12 h-116 a8 8 0 0 1 -8 -12 Z"/>
  </g>

  <text x="200" y="248" text-anchor="middle"
    font-family="'Roboto Condensed', 'Arial Narrow', sans-serif"
    font-size="18" font-weight="700" letter-spacing="3"
    fill="#193D2D" opacity="0.45">SEM IMAGEM</text>
</svg>
